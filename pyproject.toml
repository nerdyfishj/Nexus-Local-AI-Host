[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdai-assistant"
version = "1.0.0"
description = "A cross-platform terminal chat assistant for Ollama and OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
cmdai = "cmdai:main"
cmdai-install = "install:main"
cmdai-update = "cmdai_update:main"

[tool.setuptools]
py-modules = ["cmdai", "install", "cmdai_update"]

[tool.setuptools.data-files]
"share/cmdai" = ["cmdAI.ico"]
