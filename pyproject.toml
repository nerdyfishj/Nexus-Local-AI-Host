[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-local-ai-host"
version = "1.0.0"
description = "A cross-platform local AI host for Ollama, LM Studio, llama.cpp Server, and LocalAI"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
nexus = "nexus:main"
nexus-install = "nexus_install:main"
nexus-update = "nexus_update:main"

[tool.setuptools]
py-modules = ["nexus", "nexus_install", "nexus_update"]

[tool.setuptools.data-files]
"share/nexus" = ["nexus.ico", "nexus.svg"]
